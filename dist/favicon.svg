<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="SCP：收容失效">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1b1e23"/>
      <stop offset="1" stop-color="#07080a"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2ca70"/>
      <stop offset="1" stop-color="#d59a2c"/>
    </linearGradient>
  </defs>

  <!-- 面板底色与边框（呼应游戏标题界面的黑底琥珀配色） -->
  <rect x="1" y="1" width="98" height="98" rx="15" fill="url(#bg)"/>
  <rect x="3.5" y="3.5" width="93" height="93" rx="13" fill="none" stroke="#31353c" stroke-width="3"/>

  <!-- 收容失效警示斜纹 -->
  <g clip-path="url(#clip)" opacity="0.16" stroke="#e8b64c" stroke-width="5">
    <path d="M-40 78 L78 -40 M-40 40 L40 -40 M22 122 L122 22"/>
  </g>
  <clipPath id="clip">
    <rect x="3.5" y="3.5" width="93" height="93" rx="13"/>
  </clipPath>

  <!-- SCP 收容标识：三个指向中心的三箭头 -->
  <g transform="translate(50 51)" fill="url(#amber)">
    <circle r="35" fill="none" stroke="url(#amber)" stroke-width="6.5"/>
    <g id="arrow">
      <rect x="-6.5" y="-30" width="13" height="13" rx="1"/>
      <path d="M-15.5 -18 H15.5 L0 -1 Z"/>
    </g>
    <use href="#arrow" transform="rotate(120)"/>
    <use href="#arrow" transform="rotate(240)"/>
  </g>
</svg>
